services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: seo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seo_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo123456}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-seo_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - seo-net

  redis:
    image: redis:7-alpine
    container_name: seo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123456}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123456}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - seo-net

  analytics-api:
    build:
      context: ./analytics-api
      dockerfile: Dockerfile
    container_name: seo-analytics-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seo_analytics}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-seo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-seo123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      AI_SERVICE_URL: http://ai-service:5001
      GSC_CLIENT_ID: ${GSC_CLIENT_ID:-}
      GSC_CLIENT_SECRET: ${GSC_CLIENT_SECRET:-}
      GSC_REDIRECT_URI: ${GSC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/gsc/callback}
      BING_API_KEY: ${BING_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - seo-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: seo-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seo}:${POSTGRES_PASSWORD:-seo123456}@postgres:5432/${POSTGRES_DB:-seo_analytics}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seo-net

  nginx:
    image: nginx:1.25-alpine
    container_name: seo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./analytics-web/dist:/usr/share/nginx/html:ro
    depends_on:
      - analytics-api
    networks:
      - seo-net

volumes:
  postgres_data:
  redis_data:

networks:
  seo-net:
    driver: bridge
