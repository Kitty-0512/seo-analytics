# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Public site URL will be https://seo-web-<suffix>.onrender.com

databases:
  - name: seo-postgres
    plan: free
    databaseName: seo_analytics
    user: seo
    postgresMajorVersion: "15"

services:
  - type: keyvalue
    name: seo-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private network only

  - type: web
    name: seo-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen-plus
      - key: EMBEDDING_MODEL
        value: text-embedding-v3

  - type: web
    name: seo-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./analytics-api/Dockerfile
    dockerContext: ./analytics-api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: seo-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: seo-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seo-redis
          property: connectionString
      - key: AI_HOSTPORT
        fromService:
          type: web
          name: seo-ai
          property: hostport
      - key: GSC_CLIENT_ID
        sync: false
      - key: GSC_CLIENT_SECRET
        sync: false
      - key: GSC_REDIRECT_URI
        sync: false
      - key: BING_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen-plus
      - key: FRONTEND_URL
        sync: false
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m"

  - type: web
    name: seo-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: analytics-web
    envVars:
      - key: NODE_VERSION
        value: "20.20.0"
      # Set after first deploy to https://seo-api-xxxx.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
